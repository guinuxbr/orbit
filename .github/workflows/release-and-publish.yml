name: Release & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # ── Step 1: Read version and check whether a release already exists ──────
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      is_new_version: ${{ steps.tag_check.outputs.is_new }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.pkg.outputs.version }}" | grep -q .; then
            echo "is_new=false" >> $GITHUB_OUTPUT
            echo "::notice::Tag v${{ steps.pkg.outputs.version }} already exists – skipping release."
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
            echo "::notice::New version v${{ steps.pkg.outputs.version }} detected – proceeding with release."
          fi

  # ── Step 2: Build and push Docker image to GHCR ─────────────────────────
  # Runs on every push to main.
  # :latest and :sha-* are always updated.
  # Semver tags (:1.3.0, :1.3) are only added when the version is new.
  publish:
    name: Build & Push to GHCR
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract git metadata for version display
        id: git_meta
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(git log -1 --format=%ad --date=format:'%d %b %Y')" >> $GITHUB_OUTPUT

      - name: Compute major.minor version
        id: short_ver
        run: |
          echo "value=$(echo '${{ needs.check.outputs.version }}' | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.is_new_version == 'true' }}
            type=raw,value=${{ steps.short_ver.outputs.value }},enable=${{ needs.check.outputs.is_new_version == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_COMMIT_HASH=${{ steps.git_meta.outputs.commit_hash }}
            VITE_BUILD_DATE=${{ steps.git_meta.outputs.build_date }}
            VITE_APP_VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Tag and release (only when version is new) ───────────────────
  # Runs after publish succeeds so the release always points to a live image.
  release:
    name: Tag & Create GitHub Release
    needs: [check, publish]
    if: needs.check.outputs.is_new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check.outputs.version }}
          git push origin v${{ needs.check.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
