<!doctype html>
<html lang="en" data-theme="light">
<!--
  Orbit — A modern, fun spinner for names, raffles, and decisions.
  Built with vanilla JS and Tailwind CSS.
-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit | Modern Decision Spinner</title>
  <meta name="description" content="Orbit — A modern, fun spinner for names, raffles, decisions, and random picks." />
  
  <!-- Font preconnect and styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  
  <!-- Favicons and Manifest -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>

<body
  class="font-outfit bg-orbit-light-bg dark:bg-orbit-dark-bg text-text dark:text-gray-100 transition-colors duration-300 min-h-[100dvh]">
  
  <div id="app" class="flex flex-col min-h-[100dvh]">
    
    <!-- Background Animation Layer -->
    <canvas id="gravity-canvas"
      class="fixed inset-0 w-full h-full pointer-events-none z-[-1] opacity-50 dark:opacity-70 transition-opacity duration-1000"></canvas>

    <!-- Navigation Header -->
    <nav
      class="navbar h-[44px] lg:h-[48px] px-4 lg:px-8 flex justify-between items-center bg-white/80 dark:bg-black/60 backdrop-blur-xl border-b border-white/20 dark:border-white/10 sticky top-0 z-100 transition-all">
      <div class="nav-left">
        <h1 class="logo text-2xl lg:text-[1.65rem] font-extrabold flex items-center gap-2 lg:gap-3">
          <img src="/img/sun_icon.png" alt="Orbit Logo"
            class="w-7 h-7 lg:w-9 lg:h-9 object-contain rounded-full drop-shadow-primary"> Orbit
        </h1>
      </div>

      <!-- Desktop Interaction Bar -->
      <div class="nav-right hidden lg:flex items-center gap-6">
        <div
          class="tabs flex gap-1.5 bg-white/50 dark:bg-white/5 p-1 rounded-radius border border-gray-200 dark:border-white/10 shadow-sm">
          <button
            class="tab-link px-4 py-[5px] rounded-radius-sm font-semibold transition-all text-text-muted hover:text-primary dark:hover:text-primary-light"
            data-tab="names" aria-label="Names Settings">📝 Names</button>
          <button
            class="tab-link px-4 py-[5px] rounded-radius-sm font-semibold transition-all text-text-muted hover:text-primary dark:hover:text-primary-light"
            data-tab="image" aria-label="Image Settings">🖼️ Image</button>
          <button
            class="tab-link px-4 py-[5px] rounded-radius-sm font-semibold transition-all text-text-muted hover:text-primary dark:hover:text-primary-light"
            data-tab="sounds" aria-label="Sound Settings">🔊 Sounds</button>
          <button
            class="tab-link px-4 py-[5px] rounded-radius-sm font-semibold transition-all text-text-muted hover:text-primary dark:hover:text-primary-light"
            data-tab="display" aria-label="Display Settings">⚙️ Display</button>
            
          <div class="w-px bg-gray-300 dark:bg-white/10 mx-1 self-stretch"></div>
          <button id="reset-config-btn"
            class="px-4 py-[5px] rounded-radius-sm font-semibold transition-all text-text-muted dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 active:scale-95"
            title="Clear saved configuration and start fresh">🔄 Reset</button>
        </div>

        <!-- Light/Dark/Auto Theme Switcher -->
        <div
          class="theme-switcher flex bg-white/50 dark:bg-white/5 p-1 rounded-full border border-gray-200 dark:border-white/10 shadow-inner"
          id="theme-switcher">
          <button data-theme-value="light" title="Light theme"
            class="w-[38px] h-[38px] flex items-center justify-center rounded-full transition-all text-xl hover:scale-110 active:scale-95">☀️</button>
          <button data-theme-value="dark" title="Dark theme"
            class="w-[38px] h-[38px] flex items-center justify-center rounded-full transition-all text-xl hover:scale-110 active:scale-95">🌙</button>
          <button data-theme-value="auto" title="Auto (system)"
            class="w-[38px] h-[38px] flex items-center justify-center rounded-full transition-all text-xl hover:scale-110 active:scale-95">💻</button>
        </div>
      </div>

      <!-- Mobile Menu Toggle -->
      <button id="nav-menu-btn"
        class="lg:hidden flex flex-col justify-center items-center w-11 h-11 gap-[6px] rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition-all font-bold"
        aria-label="Toggle Mobile Menu" aria-expanded="false" aria-controls="nav-drawer">
        <span class="hamburger-line block w-6 h-[2px] bg-text dark:bg-white rounded-full transition-all"></span>
        <span class="hamburger-line block w-6 h-[2px] bg-text dark:bg-white rounded-full transition-all"></span>
        <span class="hamburger-line block w-6 h-[2px] bg-text dark:bg-white rounded-full transition-all"></span>
      </button>
    </nav>

    <!-- Mobile Drawer -->
    <aside id="nav-drawer"
      class="nav-drawer lg:hidden bg-white/95 dark:bg-black/90 backdrop-blur-xl border-b border-white/20 dark:border-white/10 overflow-hidden transition-all duration-300 max-h-0 z-90 relative">
      <div class="p-4 flex flex-col gap-3">
        <div class="flex flex-col gap-1">
          <button class="tab-link w-full text-left px-4 py-3 rounded-radius-sm font-semibold text-text-muted" data-tab="names">📝 Names</button>
          <button class="tab-link w-full text-left px-4 py-3 rounded-radius-sm font-semibold text-text-muted" data-tab="image">🖼️ Image</button>
          <button class="tab-link w-full text-left px-4 py-3 rounded-radius-sm font-semibold text-text-muted" data-tab="sounds">🔊 Sounds</button>
          <button class="tab-link w-full text-left px-4 py-3 rounded-radius-sm font-semibold text-text-muted" data-tab="display">⚙️ Display</button>
          <div class="h-px bg-gray-200 dark:bg-white/10 my-1"></div>
          <button id="reset-config-btn-mobile"
            class="w-full text-left px-4 py-3 rounded-radius-sm font-semibold text-text-muted dark:text-gray-400 hover:text-red-500">🔄 Reset</button>
        </div>
        <div class="flex items-center gap-2 pt-2 border-t border-gray-200 dark:border-white/10">
          <span class="text-sm font-semibold text-text-muted dark:text-gray-400">Theme:</span>
          <div class="theme-switcher flex bg-white/50 dark:bg-white/5 p-1 rounded-full border" id="theme-switcher-mobile">
            <button data-theme-value="light" class="w-9 h-9 flex items-center justify-center rounded-full transition-all">☀️</button>
            <button data-theme-value="dark" class="w-9 h-9 flex items-center justify-center rounded-full transition-all">🌙</button>
            <button data-theme-value="auto" class="w-9 h-9 flex items-center justify-center rounded-full transition-all">💻</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-layout flex-1 flex flex-col p-4 lg:p-8 max-w-[1600px] mx-auto w-full">

      <!-- Interactive Wheel Workspace -->
      <section class="wheel-section flex-1 flex flex-col justify-center items-center">
        <div id="wheel-wrapper" class="wheel-wrapper relative w-full max-w-[min(88vw,calc(100dvh-240px))] lg:max-w-[min(72vw,calc(100dvh-240px))] xl:max-w-[min(68vw,calc(100dvh-240px))] 2xl:max-w-[min(64vw,calc(100dvh-240px))] mx-auto aspect-square transition-transform">
          
          <!-- Win Pointer Indicator -->
          <div class="arrow-pointer absolute top-1/2 -right-[14px] sm:-right-[18px] lg:-right-[20px] -translate-y-1/2 z-30 drop-shadow-[0_4px_12px_rgba(0,0,0,0.4)]">
            <svg class="w-10 h-10 sm:w-12 sm:h-12 lg:w-[60px] lg:h-[60px] filter drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 30L48 12V48L12 30Z" fill="url(#arrow-grad)" stroke="white" stroke-width="3" stroke-linejoin="round" />
              <path d="M18 30L44 18V42L18 30Z" fill="white" fill-opacity="0.2" />
              <defs>
                <linearGradient id="arrow-grad" x1="48" y1="30" x2="12" y2="30" gradientUnits="userSpaceOnUse">
                  <stop stop-color="var(--color-primary)" />
                  <stop offset="1" stop-color="var(--color-accent)" />
                </linearGradient>
              </defs>
            </svg>
          </div>

          <canvas id="wheel" width="875" height="875"
            class="w-full h-full rounded-full drop-shadow-[0_20px_40px_rgba(0,0,0,0.3)] dark:drop-shadow-[0_20px_60px_rgba(0,0,0,0.6)]"></canvas>
          
          <!-- Central Spin Trigger -->
          <button id="spin-btn" aria-label="Spin the wheel"
            class="spin-button absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[29.7%] h-[29.7%] rounded-full bg-transparent border-none cursor-pointer z-20 outline-none"></button>

          <!-- Winner Announcement Toast (Centered in Wheel) -->
          <section id="winner-toast"
            class="winner-toast absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[92vw] max-w-[520px] bg-white dark:bg-orbit-dark-surface p-5 lg:p-6 px-6 lg:px-10 rounded-radius border border-primary/50 dark:border-primary/30 shadow-2xl z-1000 flex flex-col items-center gap-5 opacity-0 pointer-events-none transition-all duration-500 backdrop-blur-2xl"
            aria-live="polite">
            <div class="winner-info text-center">
              <h2 id="winner-text" class="text-3xl lg:text-4xl font-extrabold bg-primary-gradient bg-clip-text text-transparent animate-bounce"></h2>
            </div>
            <div class="winner-actions flex flex-wrap justify-center gap-3">
              <button id="remove-one-btn" class="px-5 py-2.5 rounded-lg border border-primary/20 bg-primary/5 hover:bg-primary/10 text-primary font-bold transition-all">Remove Once</button>
              <button id="remove-all-btn" class="px-5 py-2.5 rounded-lg bg-red-600 text-white font-bold shadow-lg shadow-red-600/30 hover:bg-red-700 transition-all">Remove All</button>
              <button id="close-toast-btn" class="px-5 py-2.5 rounded-lg border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 text-text-muted dark:text-gray-300 font-bold">Close</button>
            </div>
          </section>
        </div>
        
        <div id="spin-instruction"
          class="spin-instruction mt-4 lg:mt-8 text-xl sm:text-2xl lg:text-3xl font-extrabold animate-pulse-slow text-text dark:text-gray-100 transition-all text-center">
          Click centre to SPIN!</div>
      </section>

    </main>

    <!-- Contextual Settings Panel (fixed right drawer) -->
    <section class="settings-panel" id="settings-panel">
        <!-- Close button for mobile/easy access -->
        <button id="close-settings-btn" 
          class="close-settings-btn z-50 w-10 h-10 flex items-center justify-center rounded-full bg-white/20 dark:bg-black/40 backdrop-blur-md border border-white/20 dark:border-white/10 text-2xl text-text dark:text-gray-100 hover:bg-white/40 dark:hover:bg-white/10 transition-all cursor-pointer"
          aria-label="Close settings">✕</button>

        <!-- Tab: Names -->
        <div id="tab-names" class="tab-content transition-all duration-300">
          <div class="glass p-6 lg:p-8 rounded-radius border border-white/20 dark:border-white/10 shadow-xl bg-white/80 dark:bg-white/5 backdrop-blur-xl">
            <h3 class="mb-6 pb-3 text-2xl font-bold border-b-2 border-gray-200 dark:border-white/20 text-text dark:text-white">Manage Names</h3>
            <textarea id="names-input"
              class="w-full p-4 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all text-text dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
              placeholder="Enter names, one per line…" rows="10"></textarea>
          </div>
        </div>

        <!-- Tab: Image -->
        <div id="tab-image" class="tab-content transition-all duration-300">
          <div class="glass p-6 lg:p-8 rounded-radius border border-white/20 dark:border-white/10 shadow-xl bg-white/80 dark:bg-white/5 backdrop-blur-xl">
            <h3 class="mb-6 pb-3 text-2xl font-bold border-b-2 border-gray-200 dark:border-white/20 text-text dark:text-white">Center Image</h3>
            <div class="mb-6">
              <label for="image-size-select" class="block mb-2 font-bold text-text-muted dark:text-white">Image Size</label>
              <select id="image-size-select"
                class="w-full p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 focus:outline-none focus:ring-2 focus:ring-primary transition-all text-text dark:text-white">
                <option value="0.20">Small (S)</option>
                <option value="0.30" selected>Medium (M)</option>
                <option value="0.40">Large (L)</option>
                <option value="0.50">Extra Large (XL)</option>
                <option value="0.65">Mega (XXL)</option>
              </select>
            </div>
            <div class="mb-6 flex items-center gap-3">
              <input type="checkbox" id="image-bg-toggle" class="w-5 h-5 accent-primary rounded cursor-pointer" />
              <label for="image-bg-toggle" class="font-bold text-text-muted dark:text-white cursor-pointer select-none">
                Use as Wheel Background
              </label>
            </div>
            <div class="mb-6">
              <label class="block mb-2 font-bold text-text-muted dark:text-white">Load Source</label>
              <div class="flex gap-3">
                <div class="flex-1">
                  <label for="center-image-input"
                    class="flex items-center justify-center p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 font-bold cursor-pointer hover:border-primary hover:text-primary dark:hover:border-primary dark:text-white transition-all">
                    Upload
                  </label>
                  <input type="file" id="center-image-input" accept="image/*" class="hidden" />
                </div>
                <button id="browse-gallery-btn"
                  class="flex-1 p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 font-bold hover:border-primary hover:text-primary dark:hover:border-primary dark:text-white transition-all">
                  Gallery
                </button>
              </div>
            </div>
            <button id="clear-image-btn"
              class="w-full p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 font-bold hover:text-red-500 transition-all">
              ✕ Clear Image
            </button>
          </div>
        </div>

        <!-- Tab: Sounds -->
        <div id="tab-sounds" class="tab-content transition-all duration-300">
          <div class="glass p-6 lg:p-8 rounded-radius border border-white/20 dark:border-white/10 shadow-xl bg-white/80 dark:bg-white/5 backdrop-blur-xl">
            <h3 class="mb-6 pb-3 text-2xl font-bold border-b-2 border-gray-200 dark:border-white/20 text-text dark:text-white">Audio Settings</h3>
            <div class="mb-6">
              <label for="spinning-sound" class="block mb-2 font-bold text-text-muted dark:text-white">Spinning Music</label>
              <div class="flex gap-3 items-center">
                <select id="spinning-sound" class="flex-1 p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-text dark:text-white">
                  <option value="none">None</option>
                  <option value="random" selected>🎲 Random</option>
                </select>
                <div class="flex-1">
                  <label for="custom-music-input" class="flex items-center justify-center p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 font-bold cursor-pointer hover:border-primary hover:text-primary dark:hover:border-primary dark:text-white transition-all">Upload</label>
                  <input type="file" id="custom-music-input" accept="audio/*" class="hidden" />
                </div>
              </div>
            </div>
            <div class="mb-6">
              <label for="winner-sound" class="block mb-2 font-bold text-text-muted dark:text-white">Winner SFX</label>
              <div class="flex gap-3 items-center">
                <select id="winner-sound" class="flex-1 p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-text dark:text-white">
                  <option value="none">None</option>
                  <option value="random" selected>🎲 Random</option>
                </select>
                <div class="flex-1">
                  <label for="custom-sfx-input" class="flex items-center justify-center p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 font-bold cursor-pointer hover:border-primary hover:text-primary dark:hover:border-primary dark:text-white transition-all">Upload</label>
                  <input type="file" id="custom-sfx-input" accept="audio/*" class="hidden" />
                </div>
              </div>
            </div>
            <div class="mb-6">
              <label for="volume-slider" class="block mb-2 font-bold text-text-muted dark:text-white">Volume</label>
              <div class="flex items-center gap-4">
                <input type="range" id="volume-slider" min="0" max="100" value="50" class="flex-1 accent-primary h-2 bg-gray-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer" />
                <span id="volume-value" class="min-w-[40px] font-bold text-text dark:text-white text-right">50%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab: Display -->
        <div id="tab-display" class="tab-content transition-all duration-300">
          <div class="glass p-6 lg:p-8 rounded-radius border border-white/20 dark:border-white/10 shadow-xl bg-white/80 dark:bg-white/5 backdrop-blur-xl">
            <h3 class="mb-6 pb-3 text-2xl font-bold border-b-2 border-gray-200 dark:border-white/20 text-text dark:text-white">Display & Behavior</h3>
            <div class="mb-6">
              <label for="ui-theme-select" class="block mb-2 font-bold text-text-muted dark:text-white">Colour Palette</label>
              <select id="ui-theme-select" class="w-full p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-text dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"></select>
            </div>
            <div class="mb-6">
              <label for="spin-duration" class="block mb-2 font-bold text-text-muted dark:text-white">Spin Duration (sec)</label>
              <input type="number" id="spin-duration" min="1" max="30" value="15" step="1"
                class="w-full p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-text dark:text-white" />
            </div>
            <div class="mb-6">
              <label for="spin-speed" class="block mb-2 font-bold text-text-muted dark:text-white">Spin Speed</label>
              <div class="flex items-center gap-4">
                <input type="range" id="spin-speed" min="1" max="5" value="3" step="1"
                  class="flex-1 accent-primary h-2 bg-gray-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer" />
                <span id="spin-speed-value" class="min-w-[70px] font-bold text-text dark:text-white text-right">Medium</span>
              </div>
            </div>
            <div class="mb-6">
              <label for="winner-message" class="block mb-2 font-bold text-text-muted dark:text-white">Winner Toast Text</label>
              <input type="text" id="winner-message" value="{name} wins!" placeholder="Use {name} template variable"
                class="w-full p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-text dark:text-white" />
            </div>
          </div>
        </div>

    </section>

    <!-- Page Footer -->

    <!-- Gallery Image Picker Modal -->
    <div id="gallery-modal"
      class="gallery-modal hidden fixed inset-0 bg-black/60 backdrop-blur-md z-2000 flex justify-center items-center p-0 sm:p-8 transition-opacity duration-300">
      <div
        class="gallery-modal-content bg-white dark:bg-orbit-dark-surface w-full h-full sm:h-auto sm:max-h-[85vh] sm:max-w-[900px] rounded-none sm:rounded-radius p-5 sm:p-8 flex flex-col shadow-2xl animate-in zoom-in-95 duration-300 relative border-0 sm:border border-white/20 dark:border-white/10">
        <div class="gallery-modal-header flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <h3 class="text-2xl lg:text-3xl font-extrabold text-text dark:text-gray-100">Select an Image</h3>
          <div class="search-container flex w-full md:w-auto gap-2 flex-1 max-w-md">
            <input type="text" id="gallery-search-input" placeholder="Search Openverse (dogs, clouds)..."
              class="flex-1 p-3 rounded-radius-sm border border-gray-200 dark:border-white/20 bg-white dark:bg-black/60 text-text dark:text-white focus:outline-none focus:ring-2 focus:ring-primary" />
            <button id="gallery-search-btn" class="p-3 px-6 rounded-radius-sm bg-primary text-white font-bold hover:bg-primary/90 flex items-center gap-2">
              <span>🔍</span> Search
            </button>
          </div>
          <button id="gallery-close-btn" class="absolute top-4 right-4 sm:relative sm:top-auto sm:right-auto w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/10 text-2xl text-text-muted dark:text-gray-400">✕</button>
        </div>
        <div id="gallery-grid" class="flex-1 overflow-y-auto grid grid-cols-[repeat(auto-fill,minmax(130px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(160px,1fr))] gap-4 sm:gap-6 mb-6 sm:mb-8 pr-2 custom-scrollbar"></div>
        <button id="gallery-load-more" class="w-full p-4 rounded-radius-sm border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 font-bold hover:text-primary transition-all">Load More Images</button>
      </div>
    </div>

    <!-- System Error Banner -->
    <div id="error-banner"
      class="error-banner fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-danger/95 backdrop-blur-xl p-5 px-6 lg:p-6 lg:px-10 rounded-radius border border-white/20 shadow-2xl z-3000 flex items-center gap-4 text-white opacity-0 pointer-events-none transition-all duration-400 w-[92vw] max-w-[520px]"
      role="alert">
      <div class="error-content flex items-center gap-4 flex-1 min-w-0">
        <span class="error-icon text-3xl shrink-0">💀</span>
        <span id="error-message" class="text-base lg:text-lg font-bold break-words"></span>
      </div>
      <button id="close-error-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-white transition-all text-xl shrink-0">✕</button>
    </div>

    <!-- Page Footer -->
    <footer
      class="footer py-1.5 lg:py-2 px-4 lg:px-8 mt-auto bg-white/40 dark:bg-black/40 backdrop-blur-md border-t border-white/20 dark:border-white/10 transition-all">
      <div class="max-w-[1400px] mx-auto w-full flex flex-row justify-between items-center gap-4">
        <div class="footer-left">
          <p class="text-text-muted dark:text-gray-400 font-semibold">© 2026 Orbit.</p>
        </div>
        <div class="footer-right flex items-center gap-4 lg:gap-6">
          <a href="https://github.com/guinuxbr/orbit" target="_blank" rel="noopener noreferrer" class="social-icon text-text-muted dark:text-gray-400 hover:text-primary" title="GitHub">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </a>
          <div id="version-display" class="text-[10px] lg:text-xs font-medium text-text-muted dark:text-gray-500 select-none"></div>
        </div>
      </div>
    </footer>

  </div>

  <!-- Reset Confirmation Dialog -->
  <div id="reset-modal"
    class="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden"
    role="dialog" aria-modal="true" aria-labelledby="reset-modal-title">
    <div
      class="relative w-full max-w-sm mx-4 p-8 rounded-radius bg-white dark:bg-gray-900 shadow-2xl border border-gray-200 dark:border-white/10 flex flex-col gap-5 animate-in fade-in zoom-in-95">
      <div class="text-5xl text-center select-none">⚠️</div>
      <h2 id="reset-modal-title" class="text-2xl font-extrabold text-center text-text dark:text-white">Reset to Defaults?</h2>
      <p class="text-center text-text-muted dark:text-gray-400 leading-relaxed">
        This will permanently clear all saved names, settings, and the selected image. The page will reload fresh.
      </p>
      <div class="flex gap-3 mt-2">
        <button id="reset-modal-cancel" class="flex-1 px-4 py-3 rounded-radius-sm border border-gray-200 dark:border-white/10 font-bold dark:text-white">Cancel</button>
        <button id="reset-modal-confirm" class="flex-1 px-4 py-3 rounded-radius-sm bg-red-500 hover:bg-red-600 font-bold text-white shadow-lg">Start Fresh →</button>
      </div>
    </div>
  </div>

  <!-- Set --navbar-h so the fixed panel top tracks the navbar exactly -->
  <script>
    (function () {
      function setNavbarHeight() {
        const nav = document.querySelector('.navbar');
        if (nav) document.documentElement.style.setProperty('--navbar-h', nav.getBoundingClientRect().height + 'px');
      }
      setNavbarHeight();
      window.addEventListener('resize', setNavbarHeight);
    })();
  </script>

  <!-- Main JS Module -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
